name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log

      # Derleme hatalarını annotation olarak yayınlar; giriş yapmadan Actions sayfasında görünür.
      - name: Report build errors
        if: failure()
        run: |
          errors=$(grep -E '^e: |What went wrong' -A3 build.log | head -60 | sed 's/%/%25/g' | tr '\n' '|')
          echo "::error title=Build errors::${errors}"

      - uses: actions/upload-artifact@v4
        with:
          name: sms-filter-debug
          path: app/build/outputs/apk/debug/app-debug.apk
